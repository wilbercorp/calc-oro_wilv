<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GOLD CALC</title>
    
  
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Calc Gold">
    <link rel="apple-touch-icon" href="icono.png">

    <style>
        
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('https://i.pinimg.com/1200x/8e/2f/09/8e2f09e9448547b4e3a4bf35a2f4559c.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        
        .container {
            width: 100%;
            max-width: 380px; 
            padding: 25px 20px;
            
           
            background-image: linear-gradient(rgba(20, 20, 20, 0.20), rgba(20, 20, 20, 0.20)), url('https://i.pinimg.com/736x/63/2c/15/632c159eef093e0be44e91070dd23fbf.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            border: 1px solid rgba(212, 175, 55, 0.45); /* Borde delgado dorado */
            border-radius: 28px;
            backdrop-filter: blur(1px);
            box-shadow: 0px 15px 35px rgba(0, 0, 0, 0.85);
            margin-top: 15px;
            box-sizing: border-box;
        }

        h1 {
            color: #ffcc00;
            text-align: center;
            font-style: italic;
            font-size: 26px;
            margin: 0 0 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-weight: 800;
        }

        label {
            display: block;
            color: #d4af37;
            font-size: 11px;
            font-weight: bold;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding-left: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
        }

       
        input[type="number"] {
            width: 100%;
            box-sizing: border-box;
            background-color: rgba(5, 5, 5, 0.9); 
            border: 1px solid rgba(212, 175, 55, 0.6); 
            border-radius: 20px;
            color: #ffcc00;
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 4px;
            outline: none;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

       
        .total-box {
            background-color: rgba(10, 10, 10, 0.95);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            margin-top: 20px;
            border: 1px solid #d4af37; 
            box-shadow: 0px 4px 15px rgba(0,0,0,0.6);
        }

        .total-box h2 {
            color: #ffcc00;
            font-style: italic;
            margin: 0 0 5px 0;
            font-size: 15px;
            letter-spacing: 1px;
        }

        .total-box .monto {
            color: #ffcc00;
            font-size: 30px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .grid-resultados {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
            text-align: center;
        }

        
        .res-item {
            background: rgba(15, 15, 15, 0.9);
            padding: 10px;
            border-radius: 15px;
            border: 1px solid rgba(212, 175, 55, 0.4); 
        }

        .res-label {
            font-size: 10px;
            color: #bfa15f;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .res-val {
            font-size: 15px;
            color: #ffcc00;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Calc Gold</h1>
    
    <form id="goldForm" autocomplete="off">
        <label>Onza ($)</label>
        <input type="number" step="any" id="onza" placeholder="">

        <label>Ley (%)</label>
        <input type="number" step="any" id="ley" placeholder="">

        <label>Descuento %</label>
        <input type="number" step="any" id="porcentaje" placeholder="">

        <label>Cambio (T.C.)</label>
        <input type="number" step="any" id="tc" placeholder="">

        <label>Peso (Gramos)</label>
        <input type="number" step="any" id="peso" placeholder="">
    </form>

    <div class="total-box">
        <h2>TOTAL A PAGAR</h2>
        <div class="monto" id="resTotalPagar">S/. 0.0</div>
    </div>

    <div class="grid-resultados">
        <div class="res-item">
            <div class="res-label">Unidad en $</div>
            <div class="res-val" id="resUnidadUsd">$ 0.00</div>
        </div>
        <div class="res-item">
            <div class="res-label">Unidad en Soles</div>
            <div class="res-val" id="resUnidadSol">S/. 0.00</div>
        </div>
        <div class="res-item">
            <div class="res-label">Total en $</div>
            <div class="res-val" id="resTotalUsd">$ 0.00</div>
        </div>
        <div class="res-item">
            <div class="res-label">Total en Soles</div>
            <div class="res-val" id="resTotalSol">S/. 0.00</div>
            
        </div>
        
    </div></div><h1><span style="font-size: 10px; font-style: italic;">by wilver</span></h1>

</div>

<script>
const TROY_OUNCE_GRAMS = 31.1034768;

// Redondeo truncado exacto como Kotlin
function kotlinTrunc(value, decimals) {
    const factor = Math.pow(10, decimals);
    return Math.floor(Math.round(value * factor * 10000000) / 10000000) / factor;
}


function formatearConComas(valor, decimales) {
    return valor.toLocaleString('en-US', {
        minimumFractionDigits: decimales,
        maximumFractionDigits: decimales
    });
}

function calcularOro() {
    const onza = parseFloat(document.getElementById('onza').value) || 0;
    const ley = parseFloat(document.getElementById('ley').value) || 0;
    const porcentaje = parseFloat(document.getElementById('porcentaje').value) || 0;
    const tc = parseFloat(document.getElementById('tc').value) || 0;
    const peso = parseFloat(document.getElementById('peso').value) || 0;

    if (onza === 0 || ley === 0) {
        document.getElementById('resTotalPagar').innerText = "S/. 0.0";
        document.getElementById('resUnidadUsd').innerText = "$ 0.00";
        document.getElementById('resUnidadSol').innerText = "S/. 0.00";
        document.getElementById('resTotalUsd').innerText = "$ 0.00";
        document.getElementById('resTotalSol').innerText = "S/. 0.00";
        return;
    }

    const porcentajeCoerced = Math.max(0.0, Math.min(100.0, porcentaje));
    const precioGramoUsdReal = (onza / TROY_OUNCE_GRAMS) * (ley / 100.0) * (1.0 - (porcentajeCoerced / 100.0));
    
    const precioGramoUsdBase = kotlinTrunc(precioGramoUsdReal, 2);
    const precioGramoSolBase = kotlinTrunc(precioGramoUsdBase * tc, 2);
    const totalUsdReal = kotlinTrunc(precioGramoUsdBase * peso, 2);
    const totalSolReal = kotlinTrunc(totalUsdReal * tc, 2);
    const unidadSoles1Decimal = kotlinTrunc(precioGramoSolBase, 1);
    const totalAPagarMostrar = kotlinTrunc(unidadSoles1Decimal * peso, 1);

    document.getElementById('resTotalPagar').innerText = "S/. " + formatearConComas(totalAPagarMostrar, 1);
    document.getElementById('resUnidadUsd').innerText = "$ " + formatearConComas(precioGramoUsdBase, 2);
    document.getElementById('resUnidadSol').innerText = "S/. " + formatearConComas(precioGramoSolBase, 2);
    document.getElementById('resTotalUsd').innerText = "$ " + formatearConComas(totalUsdReal, 2);
    document.getElementById('resTotalSol').innerText = "S/. " + formatearConComas(totalSolReal, 2);
}

document.getElementById('goldForm').addEventListener('input', calcularOro);
</script>

</body>
</html>
